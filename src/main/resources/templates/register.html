<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            padding: 24px;
        }
        .card {
            background: #16181c; border-radius: 20px; padding: 40px;
            width: 100%; max-width: 380px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .logo { font-size: 32px; text-align: center; margin-bottom: 24px; color: #1d9bf0; }
        h1 { font-size: 20px; color: #fff; margin-bottom: 20px; text-align: center; }
        label { font-size: 13px; font-weight: 600; color: #71767b; }
        input {
            width: 100%; padding: 12px; margin: 6px 0 16px 0;
            border-radius: 10px; border: 1px solid #2f3336; background: #000; color: #fff;
            box-sizing: border-box; font-size: 14px;
        }
        button {
            width: 100%; padding: 13px; background: #1d9bf0; color: #fff;
            border: none; border-radius: 999px; font-weight: 700; font-size: 15px; cursor: pointer;
        }
        .error {
            background: #3d1518; color: #f87171; padding: 10px; border-radius: 10px;
            font-size: 13px; margin-bottom: 16px; text-align: center;
        }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #71767b; }
        .link a { color: #1d9bf0; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">𝕏</div>
        <h1>Yangi hisob yaratish</h1>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/register}" method="post">
            <label>To'liq ism</label>
            <input type="text" name="fullName" required>
            <label>Username</label>
            <input type="text" name="username" required>
            <label>Parol</label>
            <input type="password" name="password" required>
            <button type="submit">Ro'yxatdan o'tish</button>
        </form>
        <div class="link">Hisobingiz bormi? <a href="/login">Kirish</a></div>
    </div>
</body>
</html>
