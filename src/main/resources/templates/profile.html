<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profileUser.fullName}">Profil</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #000; color: #e7e9ea; }
        .top-bar {
            position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            padding: 14px 20px; display: flex; align-items: center; gap: 20px;
            border-bottom: 1px solid #2f3336; z-index: 10;
        }
        .back { color: #e7e9ea; text-decoration: none; font-size: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .cover { height: 120px; background: linear-gradient(135deg, #1d9bf0, #5c33f6); }
        .profile-info { padding: 0 20px; position: relative; }
        .avatar-lg {
            width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
            border: 4px solid #000; background: #333; margin-top: -45px;
        }
        .full-name { font-size: 20px; font-weight: 700; margin-top: 10px; }
        .username-tag { color: #71767b; font-size: 14px; margin-bottom: 10px; }
        .bio { font-size: 14px; margin-bottom: 16px; }
        .edit-btn {
            border: 1px solid #536471; color: #e7e9ea; background: transparent;
            padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 13px;
            cursor: pointer; float: right; margin-top: 12px;
        }
        .post-card { padding: 16px 20px; border-top: 1px solid #2f3336; }
        .post-content { font-size: 15px; line-height: 1.4; margin-bottom: 8px; }
        .post-meta { color: #71767b; font-size: 13px; display: flex; gap: 16px; }
        .empty { text-align: center; color: #71767b; padding: 40px 20px; }

        .modal-bg {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 20; align-items: center; justify-content: center;
        }
        .modal-bg.show { display: flex; }
        .modal {
            background: #000; border: 1px solid #2f3336; border-radius: 16px; padding: 24px;
            width: 90%; max-width: 400px;
        }
        .modal h3 { margin-bottom: 16px; }
        .modal label { font-size: 13px; color: #71767b; font-weight: 600; }
        .modal input, .modal textarea {
            width: 100%; padding: 10px; margin: 6px 0 14px 0; border-radius: 8px;
            border: 1px solid #2f3336; background: #000; color: #fff; font-family: 'Poppins', sans-serif;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-actions button {
            padding: 9px 18px; border-radius: 999px; font-weight: 700; border: none; cursor: pointer; font-size: 13px;
        }
        .save-btn { background: #1d9bf0; color: #fff; }
        .cancel-btn { background: transparent; color: #e7e9ea; border: 1px solid #536471 !important; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="back" href="/">&larr;</a>
        <div th:text="${profileUser.fullName}">Ism</div>
    </div>

    <div class="container">
        <div class="cover"></div>
        <div class="profile-info">
            <button th:if="${isOwnProfile}" class="edit-btn" onclick="document.getElementById('editModal').classList.add('show')">Tahrirlash</button>
            <img class="avatar-lg"
                 th:src="${profileUser.photoUrl != null and !profileUser.photoUrl.isEmpty()} ? ${profileUser.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${profileUser.username}">
            <div class="full-name" th:text="${profileUser.fullName}">Ism</div>
            <div class="username-tag" th:text="'@' + ${profileUser.username}">@user</div>
            <div class="bio" th:if="${profileUser.bio != null and !profileUser.bio.isEmpty()}" th:text="${profileUser.bio}">Bio</div>
        </div>

        <div th:if="${#lists.isEmpty(posts)}" class="empty">Hali postlar yo'q</div>

        <a th:each="post : ${posts}" th:href="@{/posts/{id}(id=${post.id})}" style="text-decoration:none;color:inherit;display:block;">
            <div class="post-card">
                <div class="post-content" th:text="${post.content}">Post matni</div>
                <div class="post-meta">
                    <span th:text="${#temporals.format(post.createdAt, 'dd-MM-yyyy HH:mm')}">Vaqt</span>
                    <span th:text="${post.viewCount} + ' ko\'rishlar'">0 ko'rishlar</span>
                </div>
            </div>
        </a>
    </div>

    <div class="modal-bg" id="editModal">
        <div class="modal">
            <h3>Profilni tahrirlash</h3>
            <form th:action="@{/profile/update}" method="post" enctype="multipart/form-data">
                <label>To'liq ism</label>
                <input type="text" name="fullName" th:value="${profileUser.fullName}">
                <label>Bio</label>
                <textarea name="bio" rows="3" th:text="${profileUser.bio}"></textarea>
                <label>Profil rasmi</label>
                <input type="file" name="photoFile" accept="image/*">
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="document.getElementById('editModal').classList.remove('show')">Bekor qilish</button>
                    <button type="submit" class="save-btn">Saqlash</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
