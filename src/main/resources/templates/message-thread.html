<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${otherUser.fullName}">Xabar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <style>
        .thread-page { display: flex; flex-direction: column; height: 100vh; }
        .top-bar {
            position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            padding: 14px 20px; display: flex; align-items: center; gap: 14px;
            border-bottom: 1px solid #2f3336; z-index: 5;
        }
        .back { color: #e7e9ea; text-decoration: none; font-size: 20px; }
        .avatar-sm { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #333; }
        .thread-name { font-weight: 700; font-size: 15px; }
        .thread-username { color: #71767b; font-size: 13px; }
        .call-btn {
            margin-left: auto; background: var(--accent-gradient); border: none; border-radius: 999px;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .call-btn svg { width: 20px; height: 20px; fill: #fff; }
        .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { max-width: 65%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
        .msg-bubble.mine { align-self: flex-end; background: var(--accent-gradient); color: #fff; border-bottom-right-radius: 4px; }
        .msg-bubble.theirs { align-self: flex-start; background: #2f3336; color: #e7e9ea; border-bottom-left-radius: 4px; }
        .msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; }
        .shared-post-card {
            background: rgba(255,255,255,0.08); border-radius: 12px; padding: 10px; margin-top: 6px; font-size: 13px;
        }
        .shared-post-card .sp-author { font-weight: 700; margin-bottom: 4px; }
        .send-form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid #2f3336; }
        .send-form input {
            flex: 1; background: #16181c; border: 1px solid #2f3336; border-radius: 999px;
            color: #e7e9ea; padding: 12px 18px; font-family: 'Poppins', sans-serif; font-size: 14px; outline: none;
        }
        .send-form input:focus { border-color: var(--accent); }
        .send-form button {
            background: var(--accent-gradient); color: #fff; border: none; padding: 0 20px;
            border-radius: 999px; font-weight: 700; cursor: pointer;
        }
        .empty { text-align: center; color: #71767b; padding: 40px 20px; }

        .call-bar {
            display: none; align-items: center; justify-content: space-between; gap: 14px;
            padding: 14px 20px; background: #16181c; border-bottom: 1px solid #2f3336;
        }
        .call-bar.show { display: flex; }
        .call-status { font-size: 14px; font-weight: 600; }
        .call-actions { display: flex; gap: 10px; }
        .call-actions button {
            border: none; border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 13px; cursor: pointer;
        }
        .accept-btn { background: #16a34a; color: #fff; }
        .reject-btn, .end-btn { background: #dc2626; color: #fff; }
    </style>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(${currentUser})}"></div>

    <div class="main-content thread-page">
        <div class="top-bar">
            <a class="back" href="/messages">&larr;</a>
            <img class="avatar-sm"
                 th:src="${otherUser.photoUrl != null and !otherUser.photoUrl.isEmpty()} ? ${otherUser.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${otherUser.username}">
            <div>
                <div class="thread-name" th:text="${otherUser.fullName}">Ism</div>
                <div class="thread-username" th:text="'@' + ${otherUser.username}">@user</div>
            </div>
            <button type="button" class="call-btn" onclick="startCall()" title="Qo'ng'iroq qilish">
                <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
        </div>

        <div class="call-bar" id="callBar">
            <div class="call-status" id="callStatus">Qo'ng'iroq...</div>
            <div class="call-actions" id="callActions"></div>
        </div>

        <div class="messages-area" id="messagesArea">
            <div th:if="${#lists.isEmpty(messages)}" class="empty">Hali xabar yo'q. Birinchi bo'lib yozing!</div>
            <div th:each="msg : ${messages}"
                 th:class="${msg.sender.username == currentUser.username} ? 'msg-bubble mine' : 'msg-bubble theirs'">
                <div th:text="${msg.content}">Xabar matni</div>
                <div class="shared-post-card" th:if="${msg.sharedPost != null}">
                    <div class="sp-author" th:text="${msg.sharedPost.author.fullName}">Post muallifi</div>
                    <div th:text="${msg.sharedPost.content}">Post matni</div>
                    <a th:href="@{/posts/{id}(id=${msg.sharedPost.id})}" style="color:#fff;text-decoration:underline;">Postni ko'rish</a>
                </div>
                <div class="msg-time" th:text="${#temporals.format(msg.createdAt, 'HH:mm')}">00:00</div>
            </div>
        </div>

        <form class="send-form" th:action="@{/messages/{u}/send(u=${otherUser.username})}" method="post">
            <input type="text" name="content" placeholder="Xabar yozing..." required autocomplete="off">
            <button type="submit">Yuborish</button>
        </form>
    </div>

    <div class="right-panel"></div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:inline="javascript">
    const myUsername = /*[[${currentUser.username}]]*/ '';
    const otherUsername = /*[[${otherUser.username}]]*/ '';

    let stompClient = null;
    let peerConnection = null;
    let localStream = null;
    const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function connectSocket() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, function () {
            stompClient.subscribe('/user/queue/call', function (message) {
                console.log(message)
                handleSignal(JSON.parse(message.body));
            });
        });
    }
    connectSocket();

    function sendSignal(type, data) {
        stompClient.send('/app/call.signal', {}, JSON.stringify(Object.assign({ type: type, to: otherUsername }, data)));
    }

    function showCallBar(status, actionsHtml) {
        document.getElementById('callBar').classList.add('show');
        document.getElementById('callStatus').textContent = status;
        document.getElementById('callActions').innerHTML = actionsHtml;
    }
    function hideCallBar() {
        document.getElementById('callBar').classList.remove('show');
    }

    async function createPeerConnection() {
        peerConnection = new RTCPeerConnection(iceServers);
        peerConnection.onicecandidate = function (event) {
            if (event.candidate) {
                sendSignal('candidate', { candidate: event.candidate });
            }
        };
        peerConnection.ontrack = function (event) {
            document.getElementById('remoteAudio').srcObject = event.streams[0];
        };
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        localStream.getTracks().forEach(function (track) {
            peerConnection.addTrack(track, localStream);
        });
    }

    function endCall(notify) {
        if (notify) {
            sendSignal('call-end', {});
        }
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        if (localStream) {
            localStream.getTracks().forEach(function (t) { t.stop(); });
            localStream = null;
        }
        hideCallBar();
    }

    async function startCall() {
        showCallBar("Qo'ng'iroq qilinmoqda...", '<button class="end-btn" onclick="endCall(true)">Bekor qilish</button>');
        sendSignal('call-request', {});
    }

    async function acceptCall() {
        showCallBar('Ulanmoqda...', '<button class="end-btn" onclick="endCall(true)">Tugatish</button>');
        await createPeerConnection();
        sendSignal('call-accept', {});
    }

    function rejectCall() {
        sendSignal('call-reject', {});
        hideCallBar();
    }

    async function handleSignal(msg) {
        if (msg.from !== otherUsername) return;

        if (msg.type === 'call-request') {
            showCallBar(msg.from + " sizga qo'ng'iroq qilyapti",
                '<button class="accept-btn" onclick="acceptCall()">Qabul qilish</button>' +
                '<button class="reject-btn" onclick="rejectCall()">Rad etish</button>');
        }
        else if (msg.type === 'call-accept') {
            showCallBar('Ulanmoqda...', '<button class="end-btn" onclick="endCall(true)">Tugatish</button>');
            await createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            sendSignal('offer', { sdp: offer });
        }
        else if (msg.type === 'call-reject') {
            showCallBar('Qo\'ng\'iroq rad etildi', '');
            setTimeout(hideCallBar, 2000);
        }
        else if (msg.type === 'offer') {
            if (!peerConnection) { await createPeerConnection(); }
            await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            sendSignal('answer', { sdp: answer });
            showCallBar('Qo\'ng\'iroqda', '<button class="end-btn" onclick="endCall(true)">Tugatish</button>');
        }
        else if (msg.type === 'answer') {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            showCallBar('Qo\'ng\'iroqda', '<button class="end-btn" onclick="endCall(true)">Tugatish</button>');
        }
        else if (msg.type === 'candidate') {
            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate));
                } catch (e) {}
            }
        }
        else if (msg.type === 'call-end') {
            endCall(false);
        }
    }

    const messagesArea = document.getElementById('messagesArea');
    messagesArea.scrollTop = messagesArea.scrollHeight;
</script>
</body>
</html>
