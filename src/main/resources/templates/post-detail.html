<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <style>
        .top-bar {
            position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            padding: 14px 20px; display: flex; align-items: center; gap: 20px;
            border-bottom: 1px solid #2f3336; z-index: 5;
        }
        .back { color: #e7e9ea; text-decoration: none; font-size: 20px; }
        .top-bar h2 { font-size: 18px; }
        .post-container { padding: 20px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #333; }
        .post-header { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
        .name { font-weight: 700; font-size: 16px; }
        .username { color: #71767b; font-size: 14px; }
        .post-content { font-size: 22px; line-height: 1.4; margin-bottom: 16px; word-wrap: break-word; }
        .post-image { width: 100%; height: 450px; object-fit: cover; border-radius: 16px; margin-bottom: 16px; display: block; background: #000; }
        .meta { color: #71767b; font-size: 14px; padding-bottom: 16px; border-bottom: 1px solid #2f3336; margin-bottom: 16px; }
        .stats { display: flex; gap: 24px; padding-bottom: 16px; border-bottom: 1px solid #2f3336; margin-bottom: 16px; }
        .stat-num { font-weight: 700; color: #e7e9ea; }
        .stat-label { color: #71767b; font-size: 13px; }
        .action-row { display: flex; gap: 32px; }
        .action { display: flex; align-items: center; gap: 8px; cursor: pointer; background: none; border: none; color: #71767b; font-size: 14px; font-family: 'Poppins', sans-serif; }
        .action.liked { color: var(--accent2); }
        .action svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
        .action.liked svg { fill: var(--accent2); stroke: var(--accent2); }

        .comment-form { display: flex; gap: 12px; padding: 20px 0; border-bottom: 1px solid #2f3336; margin-top: 8px; }
        .comment-form textarea {
            flex: 1; background: transparent; border: none; border-bottom: 1px solid #2f3336;
            color: #e7e9ea; font-family: 'Poppins', sans-serif; font-size: 15px; resize: none;
            outline: none; padding-bottom: 8px; min-height: 40px;
        }
        .comment-form button {
            background: var(--accent-gradient); color: #fff; border: none; padding: 8px 18px;
            border-radius: 999px; font-weight: 700; font-size: 13px; cursor: pointer; align-self: flex-start;
        }
        .comment-block { border-bottom: 1px solid #2f3336; padding: 16px 0; }
        .comment-row { display: flex; gap: 12px; }
        .comment-body { flex: 1; }
        .comment-header { display: flex; gap: 6px; align-items: baseline; margin-bottom: 2px; }
        .comment-name { font-weight: 700; font-size: 14px; }
        .comment-username, .comment-time { color: #71767b; font-size: 13px; }
        .comment-content { font-size: 14px; line-height: 1.4; margin-bottom: 6px; }
        .comment-actions { display: flex; gap: 20px; }
        .comment-action {
            display: flex; align-items: center; gap: 5px; cursor: pointer; background: none;
            border: none; color: #71767b; font-size: 12px; font-family: 'Poppins', sans-serif;
        }
        .comment-action.liked { color: var(--accent2); }
        .comment-action svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
        .comment-action.liked svg { fill: var(--accent2); stroke: var(--accent2); }
        .empty-comments { text-align: center; color: #71767b; padding: 24px 0; font-size: 14px; }

        .replies-container { margin-left: 48px; margin-top: 10px; }
        .reply-row { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #1c1f23; }
        .avatar-xs { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #333; flex-shrink: 0; }

        .reply-form { display: none; gap: 10px; padding: 10px 0 0; }
        .reply-form.show { display: flex; }
        .reply-form textarea {
            flex: 1; background: #16181c; border: 1px solid #2f3336; border-radius: 10px;
            color: #e7e9ea; font-family: 'Poppins', sans-serif; font-size: 13px; resize: none;
            outline: none; padding: 8px; min-height: 32px;
        }
        .reply-form button {
            background: var(--accent-gradient); color: #fff; border: none; padding: 6px 14px;
            border-radius: 999px; font-weight: 700; font-size: 12px; cursor: pointer; align-self: flex-start;
        }
        .share-modal-bg.show { display: flex !important; }
    </style>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(${currentUser})}"></div>

    <div class="main-content">
        <div class="top-bar">
            <a class="back" href="/">&larr;</a>
            <h2>Post</h2>
        </div>

        <div class="post-container">
            <div class="post-header">
                <img class="avatar"
                     th:src="${post.author.photoUrl != null and !post.author.photoUrl.isEmpty()} ? ${post.author.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${post.author.username}">
                <div>
                    <div class="name" th:text="${post.author.fullName}">Ism</div>
                    <div class="username" th:text="'@' + ${post.author.username}">@user</div>
                </div>
            </div>

            <div class="post-content" th:text="${post.content}">Post matni</div>
            <img th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}" class="post-image" th:src="${post.imageUrl}">
            <video th:if="${post.videoUrl != null and !post.videoUrl.isEmpty()}" class="post-image" th:src="${post.videoUrl}" controls></video>
            <div class="meta" th:text="${#temporals.format(post.createdAt, 'dd-MM-yyyy HH:mm')}">Vaqt</div>

            <div class="stats">
                <div><span class="stat-num" th:text="${likeCount}">0</span> <span class="stat-label">like</span></div>
                <div><span class="stat-num" th:text="${post.viewCount}">0</span> <span class="stat-label">ko'rishlar</span></div>
                <div><span class="stat-num" th:text="${totalCommentCount}">0</span> <span class="stat-label">izoh</span></div>
            </div>

            <div class="action-row">
                <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
                    <button type="submit" class="action" th:classappend="${likedByMe} ? 'liked' : ''">
                        <svg viewBox="0 0 24 24"><path d="M20.8 4.6c-1.6-1.6-4.2-1.6-5.8 0L12 7.6 9 4.6c-1.6-1.6-4.2-1.6-5.8 0-1.6 1.6-1.6 4.2 0 5.8l8.8 8.8 8.8-8.8c1.6-1.6 1.6-4.2 0-5.8z"/></svg>
                        <span th:text="${likedByMe} ? 'Like bosilgan' : 'Like'">Like</span>
                    </button>
                </form>
                <form th:action="@{/posts/{id}/bookmark(id=${post.id})}" method="post">
                    <button type="submit" class="action" th:classappend="${bookmarked} ? 'liked' : ''">
                        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                        <span th:text="${bookmarked} ? 'Saqlangan' : 'Saqlash'">Saqlash</span>
                    </button>
                </form>
                <button type="button" class="action" onclick="document.getElementById('shareModal').classList.add('show')">
                    <svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                    <span>Ulashish</span>
                </button>
            </div>

            <form class="comment-form" th:action="@{/posts/{id}/comment(id=${post.id})}" method="post">
                <img class="avatar-sm"
                     th:src="${currentUser.photoUrl != null and !currentUser.photoUrl.isEmpty()} ? ${currentUser.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${currentUser.username}">
                <textarea name="content" placeholder="Izoh yozing..." required></textarea>
                <button type="submit">Yuborish</button>
            </form>

            <div th:if="${#lists.isEmpty(comments)}" class="empty-comments">Hali izohlar yo'q. Birinchi bo'lib yozing!</div>

            <div class="comment-block" th:each="comment : ${comments}">
                <div class="comment-row">
                    <img class="avatar-sm"
                         th:src="${comment.author.photoUrl != null and !comment.author.photoUrl.isEmpty()} ? ${comment.author.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${comment.author.username}">
                    <div class="comment-body">
                        <div class="comment-header">
                            <span class="comment-name" th:text="${comment.author.fullName}">Ism</span>
                            <span class="comment-username" th:text="'@' + ${comment.author.username}">@user</span>
                            <span class="comment-time">&middot;</span>
                            <span class="comment-time" th:text="${#temporals.format(comment.createdAt, 'dd-MM HH:mm')}">vaqt</span>
                        </div>
                        <div class="comment-content" th:text="${comment.content}">Izoh matni</div>
                        <div class="comment-actions">
                            <form th:action="@{/comments/{id}/like(id=${comment.id})}" method="post">
                                <input type="hidden" name="postId" th:value="${post.id}">
                                <button type="submit" class="comment-action" th:classappend="${commentLikedByMe.get(comment.id)} ? 'liked' : ''">
                                    <svg viewBox="0 0 24 24"><path d="M20.8 4.6c-1.6-1.6-4.2-1.6-5.8 0L12 7.6 9 4.6c-1.6-1.6-4.2-1.6-5.8 0-1.6 1.6-1.6 4.2 0 5.8l8.8 8.8 8.8-8.8c1.6-1.6 1.6-4.2 0-5.8z"/></svg>
                                    <span th:text="${commentLikeCounts.get(comment.id)}">0</span>
                                </button>
                            </form>
                            <button type="button" class="comment-action" th:onclick="'toggleReplyForm(' + ${comment.id} + ')'">
                                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                <span>Javob berish</span>
                            </button>
                        </div>

                        <form class="reply-form" th:id="'replyForm-' + ${comment.id}"
                              th:action="@{/comments/{id}/reply(id=${comment.id})}" method="post">
                            <input type="hidden" name="postId" th:value="${post.id}">
                            <img class="avatar-xs"
                                 th:src="${currentUser.photoUrl != null and !currentUser.photoUrl.isEmpty()} ? ${currentUser.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${currentUser.username}">
                            <textarea name="content" placeholder="Javob yozing..." required></textarea>
                            <button type="submit">Yuborish</button>
                        </form>

                        <div class="replies-container" th:if="${!#lists.isEmpty(repliesMap.get(comment.id))}">
                            <div class="reply-row" th:each="reply : ${repliesMap.get(comment.id)}">
                                <img class="avatar-xs"
                                     th:src="${reply.author.photoUrl != null and !reply.author.photoUrl.isEmpty()} ? ${reply.author.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${reply.author.username}">
                                <div class="comment-body">
                                    <div class="comment-header">
                                        <span class="comment-name" th:text="${reply.author.fullName}">Ism</span>
                                        <span class="comment-username" th:text="'@' + ${reply.author.username}">@user</span>
                                        <span class="comment-time">&middot;</span>
                                        <span class="comment-time" th:text="${#temporals.format(reply.createdAt, 'dd-MM HH:mm')}">vaqt</span>
                                    </div>
                                    <div class="comment-content" th:text="${reply.content}">Javob matni</div>
                                    <div class="comment-actions">
                                        <form th:action="@{/comments/{id}/like(id=${reply.id})}" method="post">
                                            <input type="hidden" name="postId" th:value="${post.id}">
                                            <button type="submit" class="comment-action" th:classappend="${commentLikedByMe.get(reply.id)} ? 'liked' : ''">
                                                <svg viewBox="0 0 24 24"><path d="M20.8 4.6c-1.6-1.6-4.2-1.6-5.8 0L12 7.6 9 4.6c-1.6-1.6-4.2-1.6-5.8 0-1.6 1.6-1.6 4.2 0 5.8l8.8 8.8 8.8-8.8c1.6-1.6 1.6-4.2 0-5.8z"/></svg>
                                                <span th:text="${commentLikeCounts.get(reply.id)}">0</span>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="right-panel"></div>
</div>

<div class="share-modal-bg" id="shareModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:30;align-items:center;justify-content:center;">
    <div class="share-modal" style="background:#000;border:1px solid #2f3336;border-radius:16px;padding:20px;width:90%;max-width:360px;">
        <h3 style="margin-bottom:14px;font-size:16px;">Postni ulashish</h3>
        <form th:action="@{/posts/{id}/share(id=${post.id})}" method="post">
            <div th:if="${#lists.isEmpty(conversationPartners)}" style="color:#71767b;font-size:13px;text-align:center;padding:16px 0;">
                Hali hech kim bilan yozishma yo'q. Avval kimgadir xabar yuboring.
            </div>
            <select name="toUsername" style="width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #2f3336;background:#000;color:#fff;font-family:'Poppins',sans-serif;" th:if="${!#lists.isEmpty(conversationPartners)}">
                <option th:each="partner : ${conversationPartners}" th:value="${partner.username}" th:text="'@' + ${partner.username} + ' (' + ${partner.fullName} + ')'"></option>
            </select>
            <input type="text" name="note" placeholder="Izoh qo'shing (ixtiyoriy)" style="width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #2f3336;background:#000;color:#fff;font-family:'Poppins',sans-serif;">
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;">
                <button type="button" onclick="document.getElementById('shareModal').classList.remove('show')" style="padding:9px 18px;border-radius:999px;font-weight:700;background:transparent;color:#e7e9ea;border:1px solid #536471;cursor:pointer;font-size:13px;">Bekor qilish</button>
                <button type="submit" style="padding:9px 18px;border-radius:999px;font-weight:700;border:none;cursor:pointer;font-size:13px;background:var(--accent-gradient);color:#fff;">Yuborish</button>
            </div>
        </form>
    </div>
</div>

<script>
    function toggleReplyForm(commentId) {
        const form = document.getElementById('replyForm-' + commentId);
        form.classList.toggle('show');
    }
</script>
</body>
</html>
