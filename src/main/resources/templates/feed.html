<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #000; color: #e7e9ea; }
        .top-bar {
            position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2f3336; z-index: 10;
        }
        .top-bar .logo { font-size: 22px; color: #1d9bf0; font-weight: 700; }
        .top-bar .nav { display: flex; gap: 16px; align-items: center; font-size: 14px; }
        .top-bar a { color: #e7e9ea; text-decoration: none; }
        .container { max-width: 600px; margin: 0 auto; }
        .compose {
            padding: 16px 20px; border-bottom: 1px solid #2f3336; display: flex; gap: 12px;
        }
        .avatar-sm {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #333;
        }
        .compose textarea {
            width: 100%; background: transparent; border: none; color: #e7e9ea;
            font-family: 'Poppins', sans-serif; font-size: 16px; resize: none; outline: none;
            min-height: 60px;
        }
        .compose-bottom { display: flex; justify-content: flex-end; margin-top: 8px; }
        .post-btn {
            background: #1d9bf0; color: #fff; border: none; padding: 9px 20px;
            border-radius: 999px; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        .post-card {
            padding: 16px 20px; border-bottom: 1px solid #2f3336; display: flex; gap: 12px;
        }
        .post-body { flex: 1; min-width: 0; }
        .post-header { display: flex; gap: 6px; align-items: baseline; margin-bottom: 2px; }
        .post-header .name { font-weight: 700; font-size: 15px; color: #e7e9ea; text-decoration: none; }
        .post-header .username { color: #71767b; font-size: 14px; }
        .post-header .time { color: #71767b; font-size: 14px; }
        .post-content { font-size: 15px; line-height: 1.4; margin-bottom: 10px; word-wrap: break-word; }
        .post-actions { display: flex; gap: 32px; color: #71767b; font-size: 13px; }
        .action { display: flex; align-items: center; gap: 6px; cursor: pointer; background: none; border: none; color: #71767b; font-size: 13px; font-family: 'Poppins', sans-serif; }
        .action.liked { color: #f91880; }
        .action svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
        .action.liked svg { fill: #f91880; stroke: #f91880; }
        .empty { text-align: center; color: #71767b; padding: 60px 20px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">𝕏</div>
        <div class="nav">
            <a th:href="@{/profile/{u}(u=${currentUser.username})}" th:text="'@' + ${currentUser.username}">@men</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" style="background:none;border:none;color:#71767b;cursor:pointer;font-family:'Poppins',sans-serif;">Chiqish</button>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="compose">
            <img class="avatar-sm"
                 th:src="${currentUser.photoUrl != null and !currentUser.photoUrl.isEmpty()} ? ${currentUser.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${currentUser.username}">
            <form th:action="@{/posts/create}" method="post" style="flex:1;">
                <textarea name="content" placeholder="Nima gap?" required></textarea>
                <div class="compose-bottom">
                    <button type="submit" class="post-btn">Post</button>
                </div>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(posts)}" class="empty">Hali postlar yo'q. Birinchi bo'lib yozing!</div>

        <div class="post-card" th:each="post : ${posts}">
            <a th:href="@{/profile/{u}(u=${post.author.username})}">
                <img class="avatar-sm"
                     th:src="${post.author.photoUrl != null and !post.author.photoUrl.isEmpty()} ? ${post.author.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${post.author.username}">
            </a>
            <div class="post-body">
                <div class="post-header">
                    <a class="name" th:href="@{/profile/{u}(u=${post.author.username})}" th:text="${post.author.fullName}">Ism</a>
                    <span class="username" th:text="'@' + ${post.author.username}">@user</span>
                    <span class="time">&middot;</span>
                    <span class="time" th:text="${#temporals.format(post.createdAt, 'dd-MM HH:mm')}">vaqt</span>
                </div>
                <a th:href="@{/posts/{id}(id=${post.id})}" style="text-decoration:none;color:inherit;">
                    <div class="post-content" th:text="${post.content}">Post matni</div>
                </a>
                <div class="post-actions">
                    <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
                        <button type="submit" class="action" th:classappend="${likedByMe.get(post.id)} ? 'liked' : ''">
                            <svg viewBox="0 0 24 24"><path d="M20.8 4.6c-1.6-1.6-4.2-1.6-5.8 0L12 7.6 9 4.6c-1.6-1.6-4.2-1.6-5.8 0-1.6 1.6-1.6 4.2 0 5.8l8.8 8.8 8.8-8.8c1.6-1.6 1.6-4.2 0-5.8z"/></svg>
                            <span th:text="${likeCounts.get(post.id)}">0</span>
                        </button>
                    </form>
                    <span class="action">
                        <svg viewBox="0 0 24 24"><path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8-10-8-10-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span th:text="${post.viewCount}">0</span>
                    </span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
