<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <style>
        .top-header {
            position: sticky; top: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            padding: 16px 20px; border-bottom: 1px solid #2f3336; font-weight: 700; font-size: 20px; z-index: 5;
        }
        .compose {
            padding: 16px 20px; border-bottom: 1px solid #2f3336; display: flex; gap: 12px;
        }
        .compose-form { flex: 1; }
        .compose textarea {
            width: 100%; background: transparent; border: none; color: #e7e9ea;
            font-family: 'Poppins', sans-serif; font-size: 16px; resize: none; outline: none;
            min-height: 60px;
        }
        .media-preview { display: none; position: relative; margin-top: 8px; }
        .media-preview.show { display: block; }
        .media-preview img, .media-preview video { max-width: 100%; max-height: 300px; border-radius: 16px; }
        .media-preview .remove-img {
            position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #fff;
            border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 16px; z-index: 2;
        }
        .compose-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .upload-buttons { display: flex; gap: 14px; }
        .img-upload-label, .video-upload-label {
            color: var(--accent); cursor: pointer; display: flex; align-items: center;
        }
        .img-upload-label svg, .video-upload-label svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
        .img-upload-label input, .video-upload-label input { display: none; }
        .post-btn {
            background: var(--accent-gradient); color: #fff; border: none; padding: 9px 20px;
            border-radius: 999px; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        .post-card { padding: 16px 20px; border-bottom: 1px solid #2f3336; display: flex; gap: 12px; }
        .post-body { flex: 1; min-width: 0; }
        .post-header { display: flex; gap: 6px; align-items: baseline; margin-bottom: 2px; }
        .post-header .name { font-weight: 700; font-size: 15px; color: #e7e9ea; text-decoration: none; }
        .post-header .username { color: #71767b; font-size: 14px; }
        .post-header .time { color: #71767b; font-size: 14px; }
        .post-content { font-size: 15px; line-height: 1.4; margin-bottom: 10px; word-wrap: break-word; }
        .post-image { width: 100%; height: 400px; object-fit: cover; border-radius: 16px; margin-bottom: 10px; display: block; }
        .post-video { width: 100%; height: 400px; object-fit: cover; border-radius: 16px; margin-bottom: 10px; display: block; background: #000; }
        .post-actions { display: flex; gap: 32px; color: #71767b; font-size: 13px; }
        .action { display: flex; align-items: center; gap: 6px; cursor: pointer; background: none; border: none; color: #71767b; font-size: 13px; font-family: 'Poppins', sans-serif; }
        .action.liked { color: var(--accent2); }
        .action svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
        .action.liked svg { fill: var(--accent2); stroke: var(--accent2); }
        .action.saved { color: var(--accent); }
        .action.saved svg { fill: var(--accent); stroke: var(--accent); }
        .empty { text-align: center; color: #71767b; padding: 60px 20px; }

        .share-modal-bg {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 30; align-items: center; justify-content: center;
        }
        .share-modal-bg.show { display: flex; }
        .share-modal {
            background: #000; border: 1px solid #2f3336; border-radius: 16px; padding: 20px;
            width: 90%; max-width: 360px;
        }
        .share-modal h3 { margin-bottom: 14px; font-size: 16px; }
        .share-user-row {
            display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer;
        }
        .share-user-row:hover { background: #16181c; }
        .share-user-row.selected { background: rgba(168,85,247,0.15); }
        .share-modal input[type="text"] {
            width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px;
            border: 1px solid #2f3336; background: #000; color: #fff; font-family: 'Poppins', sans-serif;
        }
        .share-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
        .share-modal-actions button {
            padding: 9px 18px; border-radius: 999px; font-weight: 700; border: none; cursor: pointer; font-size: 13px;
        }
        .share-send-btn { background: var(--accent-gradient); color: #fff; }
        .share-cancel-btn { background: transparent; color: #e7e9ea; border: 1px solid #536471 !important; }
        .no-partners { color: #71767b; font-size: 13px; text-align: center; padding: 16px 0; }
    </style>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(${currentUser})}"></div>

    <div class="main-content">
        <div class="top-header">Bosh sahifa</div>

        <div class="compose">
            <img class="avatar-sm"
                 th:src="${currentUser.photoUrl != null and !currentUser.photoUrl.isEmpty()} ? ${currentUser.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${currentUser.username}">
            <form class="compose-form" th:action="@{/posts/create}" method="post" enctype="multipart/form-data" id="composeForm">
                <textarea name="content" placeholder="Nima gap?" required></textarea>

                <div class="media-preview" id="imagePreview">
                    <button type="button" class="remove-img" onclick="removeImage()">&times;</button>
                    <img id="previewImg" src="">
                </div>

                <div class="media-preview" id="videoPreview">
                    <button type="button" class="remove-img" onclick="removeVideo()">&times;</button>
                    <video id="previewVid" controls></video>
                </div>

                <div class="compose-bottom">
                    <div class="upload-buttons">
                        <label class="img-upload-label">
                            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                            <input type="file" name="imageFile" accept="image/*" id="imageInput" onchange="previewImage(event)">
                        </label>
                        <label class="video-upload-label">
                            <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                            <input type="file" name="videoFile" accept="video/*" id="videoInput" onchange="previewVideo(event)">
                        </label>
                    </div>
                    <button type="submit" class="post-btn">Post</button>
                </div>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(posts)}" class="empty">Hali postlar yo'q. Birinchi bo'lib yozing!</div>

        <div class="post-card" th:each="post : ${posts}">
            <a th:href="@{/profile/{u}(u=${post.author.username})}">
                <img class="avatar-sm"
                     th:src="${post.author.photoUrl != null and !post.author.photoUrl.isEmpty()} ? ${post.author.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${post.author.username}">
            </a>
            <div class="post-body">
                <div class="post-header">
                    <a class="name" th:href="@{/profile/{u}(u=${post.author.username})}" th:text="${post.author.fullName}">Ism</a>
                    <span class="username" th:text="'@' + ${post.author.username}">@user</span>
                    <span class="time">&middot;</span>
                    <span class="time" th:text="${#temporals.format(post.createdAt, 'dd-MM HH:mm')}">vaqt</span>
                </div>
                <a th:href="@{/posts/{id}(id=${post.id})}" style="text-decoration:none;color:inherit;">
                    <div class="post-content" th:text="${post.content}">Post matni</div>
                    <img th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}" class="post-image" th:src="${post.imageUrl}">
                </a>
                <video th:if="${post.videoUrl != null and !post.videoUrl.isEmpty()}" class="post-video" th:src="${post.videoUrl}" controls></video>
                <div class="post-actions">
                    <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
                        <button type="submit" class="action" th:classappend="${likedByMe.get(post.id)} ? 'liked' : ''">
                            <svg viewBox="0 0 24 24"><path d="M20.8 4.6c-1.6-1.6-4.2-1.6-5.8 0L12 7.6 9 4.6c-1.6-1.6-4.2-1.6-5.8 0-1.6 1.6-1.6 4.2 0 5.8l8.8 8.8 8.8-8.8c1.6-1.6 1.6-4.2 0-5.8z"/></svg>
                            <span th:text="${likeCounts.get(post.id)}">0</span>
                        </button>
                    </form>
                    <a th:href="@{/posts/{id}(id=${post.id})}" class="action" style="text-decoration:none;">
                        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </a>
                    <span class="action">
                            <svg viewBox="0 0 24 24"><path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8-10-8-10-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <span th:text="${post.viewCount}">0</span>
                        </span>
                    <form th:action="@{/posts/{id}/bookmark(id=${post.id})}" method="post">
                        <button type="submit" class="action" th:classappend="${bookmarkedByMe.get(post.id)} ? 'saved' : ''">
                            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                        </button>
                    </form>
                    <button type="button" class="action" th:onclick="'openShareModal(' + ${post.id} + ')'">
                        <svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <span>Qidirish</span>
        </div>
        <div class="widget-box">
            <h3>Statistika</h3>
            <div class="widget-stat"><span>Jami postlar</span><span class="num" th:text="${totalPosts}">0</span></div>
            <div class="widget-stat"><span>Jami foydalanuvchilar</span><span class="num" th:text="${totalUsers}">0</span></div>
        </div>
    </div>
</div>

<div class="share-modal-bg" id="shareModal">
    <div class="share-modal">
        <h3>Postni ulashish</h3>
        <form id="shareForm" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div th:if="${#lists.isEmpty(conversationPartners)}" class="no-partners">
                Sizda hali suhbatlar yo'q. Postni ulashish uchun avval suhbat boshlang.
            </div>
            <div th:each="partner : ${conversationPartners}" class="share-user-row"
                 th:data-username="${partner.username}"
                 onclick="selectPartner(this, this.dataset.username)">
                <img class="avatar-sm" style="width:32px;height:32px;"
                     th:src="${partner.photoUrl != null and !partner.photoUrl.isEmpty()} ? ${partner.photoUrl} : 'https://api.dicebear.com/7.x/initials/svg?seed=' + ${partner.username}">
                <div>
                    <div style="font-size:14px;font-weight:600;" th:text="${partner.fullName}">Ism</div>
                    <div style="font-size:12px;color:#71767b;" th:text="'@' + ${partner.username}">@user</div>
                </div>
            </div>
            <input type="hidden" name="toUsername" id="toUsernameInput">
            <input type="text" name="note" placeholder="Izoh qo'shing (ixtiyoriy)">
            <div class="share-modal-actions">
                <button type="button" class="share-cancel-btn" onclick="closeShareModal()">Bekor qilish</button>
                <button type="submit" class="share-send-btn">Yuborish</button>
            </div>
        </form>
    </div>
</div>

<script>
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('imagePreview').classList.add('show');
            };
            reader.readAsDataURL(file);
        }
    }
    function removeImage() {
        document.getElementById('imageInput').value = '';
        document.getElementById('imagePreview').classList.remove('show');
    }
    function previewVideo(event) {
        const file = event.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            document.getElementById('previewVid').src = url;
            document.getElementById('videoPreview').classList.add('show');
        }
    }
    function removeVideo() {
        document.getElementById('videoInput').value = '';
        document.getElementById('videoPreview').classList.remove('show');
    }
    function openShareModal(postId) {
        document.getElementById('shareForm').action = '/posts/' + postId + '/share';
        document.getElementById('shareModal').classList.add('show');
    }
    function closeShareModal() {
        document.getElementById('shareModal').classList.remove('show');
    }
    function selectPartner(el, username) {
        document.querySelectorAll('.share-user-row').forEach(function(r) { r.classList.remove('selected'); });
        el.classList.add('selected');
        document.getElementById('toUsernameInput').value = username;
    }
</script>
</body>
</html>
